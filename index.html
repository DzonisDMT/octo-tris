<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Octo-Tris</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#14141c;--body:#cbc4ab;--lcd:#9bbc3a;--ink:#1d3a1d;--btn:#7a2e45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P','Courier New',monospace;overflow:hidden}
.gb{width:min(calc(100vw - 16px),380px);background:var(--body);border-radius:18px 18px 56px 18px;padding:12px 14px 18px;box-shadow:0 6px 0 #8a8268}
.top{display:flex;justify-content:space-between;font-size:8px;color:var(--btn);margin-bottom:8px}
.bezel{background:#4a4838;border-radius:10px;padding:9px}
.lcd{background:var(--lcd);display:flex;gap:8px;padding:6px;position:relative;color:var(--ink)}
.board{flex:0 0 56%}
canvas{display:block;width:100%;border:2px solid var(--ink)}
.side{flex:1;display:flex;flex-direction:column;gap:7px;font-size:7px;min-width:0}
.side b{display:block;font-size:10px;margin-top:3px}
.mw{position:relative;align-self:center;width:64px;margin-top:8px}.mw.pop{animation:pop .6s}@keyframes pop{30%{transform:scale(1.35) rotate(8deg)}}
#mascot{display:block;width:100%;transition:filter .4s;animation:bob 1.6s ease-in-out infinite}
#hat{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:17px;z-index:1}
#nm{text-align:center;font-size:7px;color:var(--btn)}
@keyframes shake{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
#b.shake{animation:shake .3s}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
#msg{height:10px;color:var(--btn);font-size:8px}
.ov{position:absolute;inset:0;background:rgba(155,188,58,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:10px;line-height:1.7;padding:10px}
.ov.hide{display:none}
.ov h1{font-size:16px;margin:0;color:var(--btn)}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 2px}
.dp{display:grid;grid-template-columns:repeat(3,50px);grid-auto-rows:50px}.dp button.on{background:#111}.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 #4d1c2c}
.dp button{background:#3a3a3a;border:0;border-radius:4px;color:#888;font-size:10px}
.dp button:active{background:#222}
.dp i{background:transparent}.dp i:nth-child(5){background:#3a3a3a}
.ab{position:relative;width:142px;height:104px}
.ab button{position:absolute;width:66px;height:66px;border-radius:50%;border:0;background:var(--btn);color:#e8b4c4;font:inherit;font-size:11px;box-shadow:0 4px 0 #4d1c2c}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #4d1c2c}
#bB{left:0;bottom:0}#bA{right:0;top:0}
.hint{text-align:center;font-size:6px;color:#7a7460;margin-top:18px;line-height:1.8}
#bP{font:inherit;font-size:8px;background:#8a8268;color:#efe9d6;border:0;border-radius:10px;padding:9px 18px;margin-bottom:8px;transform:rotate(-12deg)}
#mu{font:inherit;font-size:7px;background:none;border:0;color:var(--btn);padding:0}

#lbBtn{font:inherit;font-size:6px;background:#8a8268;color:#efe9d6;border:0;border-radius:8px;padding:8px 10px;margin-left:6px}
#lbModal{display:none;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:14px;font-family:'Press Start 2P','Courier New',monospace}
#lbModal.open{display:flex}
.lbPanel{width:min(100%,390px);max-height:88dvh;overflow:auto;background:#cbc4ab;color:#1d3a1d;border:5px solid #7a7460;border-radius:14px;padding:14px;box-shadow:0 8px 0 #655e4b}
.lbPanel h2{font-size:12px;color:#7a2e45;text-align:center;margin:4px 0 14px}
.lbPanel label{display:block;font-size:7px;margin:10px 0 6px}
.lbPanel input{width:100%;font:10px 'Press Start 2P',monospace;padding:10px;border:2px solid #596b2d;background:#e2e9b7;color:#1d3a1d;border-radius:5px;user-select:text}
.lbActions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.lbActions button{font:7px 'Press Start 2P',monospace;padding:9px 7px;border:0;border-radius:5px;background:#7a2e45;color:#fff}
.lbActions button.active{background:#1d3a1d}
#lbRows{font:7px 'Press Start 2P',monospace;line-height:2;max-height:34dvh;overflow:auto;background:#a3c243;padding:8px;border:2px solid #596b2d}
.lbRow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #61752c;padding:4px 0}
#lbStatus{font:7px 'Press Start 2P',monospace;line-height:1.8;margin-top:9px;overflow-wrap:anywhere}
.lbClose{float:right;background:#7a7460!important}
</style></head><body>

<script>

let AC,mute=false;

addEventListener('contextmenu',e=>e.preventDefault());
function tone(f,d,type,v,t0,to){
  if(mute||!AC)return;
  const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
}
function sfx(n,a){
  if(n==='move')tone(200,.04,'square',.03);
  else if(n==='rot')tone(380,.07,'square',.04,0,560);
  else if(n==='drop'){tone(160,.14,'sawtooth',.07,0,45)}
  else if(n==='lock')tone(110,.08,'triangle',.12);
  else if(n==='clear'){tone(300,.12,'sine',.12,0,900);[523,659,784,1047].slice(0,a+1).forEach((f,i)=>tone(f,.12,'square',.05,.08*i+.05))}
  else if(n==='level')[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.1,'square',.05,.07*i));
  else if(n==='start')[392,523,659].forEach((f,i)=>tone(f,.1,'square',.05,.08*i));
  else if(n==='over'){tone(400,.7,'sawtooth',.07,0,60);tone(300,.7,'sine',.1,.15,40)}
}
const MS=[['OCTAVIO',0,'',1],['PINKY',300,'\u{1F576}\uFE0F',1],['BLUEY',200,'\u{1F3A9}',1],['MINTY',120,'\u{1F451}',1],['LIMEY',70,'\u{1F3A7}',1],['GRAPE',255,'\u{1F920}',1],['INKY',230,'\u2B50',.5],['GOLDEN',-25,'\u{1F525}',1.15]];
function mascot(){
  const s=MS[((level||1)-1)%MS.length];
  $('mascot').style.filter='hue-rotate('+s[1]+'deg) brightness('+s[3]+')';
  $('hat').textContent=s[2];$('nm').textContent=s[0];
  const w=$('mw');w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
}

const each=(m,f)=>m.forEach((row,r)=>row.forEach((v,c)=>v&&f(r,c,v)));
function rnd(){
  if(!bag.length)bag=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5);
  const i=bag.pop(),m=SH[i].map(r=>[...r]);
  outer:for(const r of m)for(let c=0;c<r.length;c++)if(r[c]){r[c]=2;break outer}
  return{m,c:i+1};
}
const hit=(m,px,py)=>{let h=false;each(m,(r,c)=>{const a=px+c,b=py+r;if(a<0||a>=W||b>=H||(b>=0&&bd[b][a]))h=true});return h};
const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());
function spawn(){
  p=nxt||rnd();nxt=rnd();
  p.x=(W-p.m[0].length)>>1;p.y=0;
  if(hit(p.m,p.x,p.y))end();
}
function lock(){sfx('lock');
  each(p.m,(r,c,v)=>{if(p.y+r>=0)bd[p.y+r][p.x+c]={c:p.c,e:v==2}});
  let n=0;
  for(let j=H-1;j>=0;j--)if(bd[j].every(v=>v)){splat(j);bd.splice(j,1);bd.unshift(Array(W).fill(0));n++;j++}
  if(n){
    sfx('clear',n);shake(n);score+=[0,100,300,500,800][n]*level;lines+=n;const ol=level;level=1+(lines/10|0);if(level>ol){setTimeout(()=>sfx('level'),450);mascot()}

    setTimeout(()=>$('msg').textContent='',900);
  }
  hud();spawn();
}
function hud(){$('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level}

function down(manual){

function drop(){sfx('drop');while(!hit(p.m,p.x,p.y+1)){p.y++;score+=2}hud();lock()}
function move(d){if(!hit(p.m,p.x+d,p.y)){p.x+=d;sfx('move')}}
function turn(ccw){let r=rot(p.m);if(ccw)r=rot(rot(r));sfx('rot');for(const k of [0,-1,1,-2,2])if(!hit(r,p.x+k,p.y)){p.m=r;p.x+=k;break}}
function pause(){

}
function act(k){
  if(state==='title'||state==='over'){if(k==='A'||k==='P')start();return}
  if(k==='P'){pause();return}
  if(state!=='play')return;
  ({L:()=>move(-1),R:()=>move(1),D:()=>down(true),A:()=>turn(),Z:()=>turn(true),U:drop})[k]();
}

  g.roundRect?g.roundRect(px+1,py+1,C-2,C-2,6):g.rect(px+1,py+1,C-2,C-2);g.fill();
  g.fillStyle='rgba(255,255,255,.4)';g.fillRect(px+4,py+3,5,3);
  if(e){dot(g,px+6,py+11,3.4,'#fff');dot(g,px+14,py+11,3.4,'#fff');dot(g,px+7,py+11.5,1.6,'#111');dot(g,px+15,py+11.5,1.6,'#111')}
}
const fx=[];
function splat(j){
  const cy=j*C+C/2,t=performance.now();
  fx.push({k:'band',y:j*C,t,d:350});
  for(let i=0;i<W;i++){
    fx.push({k:'blob',x:(i+.5)*C,y:cy,r:8+Math.random()*8,t,d:650});
    for(let q=0;q<2;q++)fx.push({k:'drop',x:(i+.5)*C,y:cy,vx:(Math.random()-.5)*160,vy:-60-Math.random()*140,r:2+Math.random()*3,t,d:700+Math.random()*300});
  }
}
function drawFx(){
  const now=performance.now();
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i],a=(now-f.t)/f.d;
    if(a>=1){fx.splice(i,1);continue}
    if(f.k==='band'){x.fillStyle='rgba(255,255,255,'+(.8*(1-a))+')';x.fillRect(0,f.y,W*C,C)}
    else if(f.k==='blob'){const r=f.r*(.4+Math.min(1,a*4)*.9);x.globalAlpha=1-a*a;dot(x,f.x,f.y,r,'#1b1030');dot(x,f.x-r*.3,f.y-r*.3,r*.25,'#6a5a9a');x.globalAlpha=1}
    else{const s=(now-f.t)/1000;x.globalAlpha=1-a;dot(x,f.x+f.vx*s,f.y+f.vy*s+400*s*s,f.r,'#1b1030');x.globalAlpha=1}
  }
}
function shake(n){if(n<2)return;cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake')}
function dot(g,cx,cy,r,col){g.fillStyle=col;g.beginPath();g.arc(cx,cy,r,0,7);g.fill()}
function draw(){
  x.fillStyle='#a3c243';x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle='rgba(30,60,30,.1)';x.beginPath();
  for(let i=1;i<W;i++){x.moveTo(i*C,0);x.lineTo(i*C,H*C)}
  for(let j=1;j<H;j++){x.moveTo(0,j*C);x.lineTo(W*C,j*C)}
  x.stroke();
  if(!bd)return;
  bd.forEach((r,j)=>r.forEach((v,i)=>v&&cell(x,i*C,j*C,v.c,v.e)));
  if(p&&state==='play'){
    let gy=p.y;while(!hit(p.m,p.x,gy+1))gy++;
    x.globalAlpha=.28;each(p.m,(r,c)=>cell(x,(p.x+c)*C,(gy+r)*C,p.c,0));x.globalAlpha=1;
    each(p.m,(r,c,v)=>cell(x,(p.x+c)*C,(p.y+r)*C,p.c,v==2));
  }
  drawFx();nx.clearRect(0,0,80,60);
  if(nxt){const ox=(4-nxt.m[0].length)*C/2,oy=(3-nxt.m.length)*C/2;each(nxt.m,(r,c,v)=>cell(nx,ox+c*C,oy+r*C,nxt.c,v==2))}
}
function loop(t){
  requestAnimationFrame(loop);
  if(state==='play'){
    acc+=t-last;
    const sp=Math.max(90,800-(level-1)*70);
    if(acc>=sp){acc=0;down(false)}
  }
  last=t;draw();
}
function hold(el,k,rep){
  let to,iv;
  const stop=()=>{clearTimeout(to);clearInterval(iv);el.classList.remove('on')};
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}if(navigator.vibrate)navigator.vibrate(8);el.classList.add('on');act(k);if(rep){to=setTimeout(()=>{iv=setInterval(()=>act(k),55)},160)}});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,stop));
}
hold($('bL'),'L',1);hold($('bR'),'R',1);hold($('bD'),'D',1);
hold($('bU'),'U');hold($('bA'),'A');hold($('bB'),'Z');hold($('bP'),'P');
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'SND OFF':'SND ON'};
ov.addEventListener('pointerdown',()=>{if(state==='title'||state==='over')act('A');else if(state==='pause')pause()});
addEventListener('keydown',e=>{
  const m={ArrowLeft:'L',ArrowRight:'R',ArrowDown:'D',ArrowUp:'A',x:'A',' ':'U',p:'P',z:'Z',Enter:'A'}[e.key];
  if(m){e.preventDefault();act(m)}
});

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveNickname(){
  const v=$('nickname').value.trim().replace(/[^a-zA-Z0-9 _-]/g,'').slice(0,16);
  if(!v){$('lbStatus').textContent='Enter a nickname first.';return}
  nickname=v;$('nickname').value=v;
  try{localStorage.setItem('octo-nickname',v)}catch(e){}
  $('lbStatus').textContent='Nickname saved on this device.';
}
async function sb(path,options={}){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw new Error('Global leaderboard is not connected yet. Supabase setup is required.');
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',...(options.headers||{})}});
  if(!r.ok)throw new Error('Leaderboard request failed ('+r.status+').');
  return r.status===204?null:r.json();
}
async function submitScore(value){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!nickname||value<=0)return;
  try{await sb('octotris_scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({nickname,score:value,lines:lines,level:level})});lastScoreSubmitted=value}
  catch(e){console.warn(e)}
}
async function loadLeaderboard(period){
  leaderPeriod=period;
  ['Daily','Weekly','All'].forEach(k=>$('tab'+k).classList.toggle('active',k.toLowerCase()===period||k==='All'&&period==='all'));
  $('lbRows').textContent='Loading...';
  try{
    const since=period==='daily'?new Date(Date.now()-86400000).toISOString():period==='weekly'?new Date(Date.now()-7*86400000).toISOString():null;
    const query='select=nickname,score,created_at&order=score.desc&limit=20'+(since?'&created_at=gte.'+encodeURIComponent(since):'');
    const rows=await sb('octotris_scores?'+query);
    $('lbRows').innerHTML=rows.length?rows.map((r,i)=>'<div class="lbRow"><span>'+(i+1)+'. '+escapeHtml(r.nickname)+'</span><b>'+Number(r.score).toLocaleString()+'</b></div>').join(''):'No scores yet. Be the first!';
    $('lbStatus').textContent='Your best: '+best+' · Games played on this device: '+gamesPlayed;
  }catch(e){$('lbRows').textContent='Global leaderboard is not connected yet.';$('lbStatus').textContent=e.message+' Your personal best and games played are saved locally.'}
}
function openLeaderboard(){ $('lbModal').classList.add('open');$('nickname').value=nickname;loadLeaderboard(leaderPeriod)}
$('lbBtn').onclick=openLeaderboard;
$('lbClose').onclick=()=>$('lbModal').classList.remove('open');
$('lbModal').addEventListener('click',e=>{if(e.target===$('lbModal'))$('lbModal').classList.remove('open')});
$('saveNick').onclick=()=>{saveNickname();loadLeaderboard(leaderPeriod)};
$('tabDaily').onclick=()=>loadLeaderboard('daily');
$('tabWeekly').onclick=()=>loadLeaderboard('weekly');
$('tabAll').onclick=()=>loadLeaderboard('all');
$('shareScore').onclick=()=>{const text='I scored '+(score||best)+' in OCTO-TRIS! Can you beat me?';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank','noopener')};

mascot();show('<h1>OCTO-TRIS</h1><div>STACK THE ARMS<br>CLEAR THE INK</div><div>PRESS A</div>');
requestAnimationFrame(loop);
</script></body></html>
